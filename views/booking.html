<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book a Table | Chaat Chowk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Link your existing CSS -->
    <link rel="stylesheet" href="/css/style.css">

    <style>
        /* Minimal safe styling in case CSS is basic */
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
        }

        .booking-container {
            max-width: 500px;
            margin: 60px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .booking-container h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .booking-container label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        .booking-container input,
        .booking-container button {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
        }

        .booking-container button {
            margin-top: 25px;
            background-color: #d62828;
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .booking-container button:hover {
            background-color: #b71c1c;
        }
    </style>
</head>
<body>

    <div class="booking-container">
        <h1>Book a Table</h1>

        <!-- IMPORTANT: action and method match Express backend -->
        <form action="/book" method="POST">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >

            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter phone number"
                required
            >

            <label for="date">Booking Date</label>
            <input
                type="date"
                id="date"
                name="date"
                required
            >

            <label for="guests">Number of Guests</label>
            <input
                type="number"
                id="guests"
                name="guests"
                min="1"
                max="20"
                placeholder="e.g. 4"
                required
            >

            <button type="submit">Confirm Booking</button>

        </form>
    </div>

</body>
</html>
