<!DOCTYPE html>
<html>
<head>
  <title>Admin | Bookings</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <h1>All Bookings</h1>

  <table border="1" cellpadding="10">
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Date</th>
        <th>Guests</th>
        <th>Created</th>
      </tr>
    </thead>
    <tbody id="booking-table"></tbody>
  </table>

  <script>
    fetch("/admin/bookings")
      .then(res => res.json())
      .then(data => {
        const table = document.getElementById("booking-table");
        data.forEach(b => {
          const row = `
            <tr>
              <td>${b.name}</td>
              <td>${b.phone}</td>
              <td>${b.date}</td>
              <td>${b.guests}</td>
              <td>${b.created_at}</td>
            </tr>
          `;
          table.innerHTML += row;
        });
      });
  </script>
</body>
</html>
